CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 1
    MaxMessages = 2
    MaxViewLag = 0
    MaxAllocationId = 2
    MaxRaftEntries = 0
    MaxPendingRaft = 0
    FaultMode = "C3"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = FALSE
    ReplicaFencing = FALSE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = TRUE
    PrimaryNode = n1
    LostNode = n3
    MetadataLeader = n2

INIT C3Init
NEXT C3Next

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
