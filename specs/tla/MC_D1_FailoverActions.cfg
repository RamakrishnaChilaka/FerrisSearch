CONSTANTS
    Nodes = {p, q, r}
    Docs = {x, y}
    MaxWrites = 5
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 3
    MaxMessages = 20
    MaxViewLag = 3
    MaxAllocationId = 2
    MaxRaftEntries = 2
    MaxPendingRaft = 2
    FaultMode = "D1Fixed"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = p
    ReplicaNode = q
    DocX = x
    DocY = y
    P = p
    Q = q
    R = r
    X = x
    Y = y

SPECIFICATION FailoverSpec

INVARIANTS
    FailoverTypeOK
    RoutingWellFormed
    NoCopyBehindAcked
    D1NoAcknowledgedDeleteResurrection
    D1ProcessedCheckpointGapAware
    D1PersistedCheckpointGapAware
    D1WalHasNoDuplicateSeq
    PromotionComplete
    AdmissionComplete
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
    FailoverProgressEnabled
    FailoverActionsCovered
