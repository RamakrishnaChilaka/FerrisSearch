CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 0
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 2
    MaxMessages = 0
    MaxViewLag = 3
    MaxAllocationId = 3
    MaxRaftEntries = 2
    MaxPendingRaft = 2
    FaultMode = "L2"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    CandidateNode = n2
    TargetNode = n3
    MetadataLeader = n2

SPECIFICATION PromotionLivenessSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm

PROPERTIES
    BarrierReleased
    RecoveryConverges
    PendingResolves
    PendingMarkerResolves
