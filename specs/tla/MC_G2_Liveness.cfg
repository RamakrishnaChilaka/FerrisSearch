CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 2
    MaxMessages = 1
    MaxViewLag = 4
    MaxAllocationId = 6
    MaxRaftEntries = 4
    MaxPendingRaft = 1
    FaultMode = "G2"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    PrimaryNode = n1
    TargetNode = n2
    MetadataLeader = n1

SPECIFICATION G2LivenessSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm

PROPERTIES
    BarrierReleased
    RecoveryConverges
    PendingResolves
    WritesResumeAfterReplicaDiskLoss
    ReplacementEventuallyInSync
    StaleFailureEventuallyRejected
