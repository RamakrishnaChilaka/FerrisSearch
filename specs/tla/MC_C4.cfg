CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 1
    MaxMessages = 2
    MaxViewLag = 0
    MaxAllocationId = 2
    MaxRaftEntries = 0
    MaxPendingRaft = 0
    FaultMode = "C4"
    InitialOutOfSync = FALSE
    EnableRecovery = FALSE
    AllocationIds = FALSE
    PrimaryNode = n1
    MetadataLeader = n2

INIT C4Init
NEXT C4Next

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
