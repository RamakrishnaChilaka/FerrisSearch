CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 1
    MaxMessages = 2
    MaxViewLag = 0
    MaxAllocationId = 2
    MaxRaftEntries = 0
    MaxPendingRaft = 0
    FaultMode = "C4"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = FALSE
    ReplicaFencing = FALSE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = TRUE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    MetadataLeader = n2

INIT C4Init
NEXT C4Next

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
