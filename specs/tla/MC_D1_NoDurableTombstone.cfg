CONSTANTS
    Nodes = {p, r}
    Docs = {x, y}
    MaxWrites = 3
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 2
    MaxMessages = 6
    MaxViewLag = 1
    MaxAllocationId = 2
    MaxRaftEntries = 0
    MaxPendingRaft = 0
    FaultMode = "D1Fixed"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = p
    ReplicaNode = r
    DocX = x
    DocY = y

INIT D1Init
NEXT D1NoTombstoneNext

INVARIANTS
    D1TypeOK
    D1ProcessedCheckpointGapAware
    D1PersistedCheckpointGapAware
    D1WalHasNoDuplicateSeq
    NoCopyBehindAcked
    D1QuiescentConvergence
    D1DeleteNotResurrected
    D1ReplayCovered
    D1NoDurableTombstoneAtRestart
    D1WalTruncatedToBoundary
