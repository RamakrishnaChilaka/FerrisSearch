CONSTANTS
    Nodes = {p, r}
    Docs = {x, y}
    MaxWrites = 3
    MaxCrashes = 2
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 2
    MaxMessages = 6
    MaxViewLag = 2
    MaxAllocationId = 2
    MaxRaftEntries = 1
    MaxPendingRaft = 1
    FaultMode = "D1Fixed"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = p
    ReplicaNode = r
    DocX = x
    DocY = y

SPECIFICATION TraceActionsSpec

INVARIANTS
    TraceActionsTypeOK
    RoutingWellFormed
    NoCopyBehindAcked
    D1NoAcknowledgedDeleteResurrection
    D1ProcessedCheckpointGapAware
    D1PersistedCheckpointGapAware
    D1WalHasNoDuplicateSeq
    EarlierCapturePersists
    BothNodesRestarted
    FailedReplayUnavailable
