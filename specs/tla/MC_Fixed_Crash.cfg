CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 2
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 1
    MaxAllocationId = 6
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "C1"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
