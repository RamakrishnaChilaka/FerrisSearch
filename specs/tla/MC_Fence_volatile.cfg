CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 2
    MaxCrashes = 1
    MaxPartitions = 1
    MaxRecoveries = 0
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 2
    MaxAllocationId = 8
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "C2"
    InitialOutOfSync = FALSE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = TRUE
    PrimaryNode = n1
    MetadataLeader = n2
    ReplicaNode = n3

INIT FenceDurabilityInit
NEXT FenceDurabilityNext

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoStaleReplicaApply
    FenceRejectsStaleProbe
