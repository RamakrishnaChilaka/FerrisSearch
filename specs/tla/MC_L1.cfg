CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 0
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 1
    MaxMessages = 0
    MaxViewLag = 1
    MaxAllocationId = 2
    MaxRaftEntries = 1
    MaxPendingRaft = 1
    FaultMode = "L1"
    InitialOutOfSync = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    PrimaryNode = n1
    TargetNode = n2

SPECIFICATION LivenessSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe

PROPERTIES
    BarrierReleased
    RecoveryConverges
    PendingResolves
