CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 2
    MaxCrashes = 0
    MaxPartitions = 1
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 2
    MaxRaftEntries = 5
    MaxPendingRaft = 2
    FaultMode = "C2"
    InitialOutOfSync = FALSE
    EnableRecovery = FALSE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
