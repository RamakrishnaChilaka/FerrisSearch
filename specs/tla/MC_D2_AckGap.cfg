CONSTANTS
    Nodes = {p, q, r}
    Docs = {x, y}
    MaxWrites = 2
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 1
    MaxMessages = 8
    MaxViewLag = 0
    MaxAllocationId = 1
    MaxRaftEntries = 0
    MaxPendingRaft = 0
    FaultMode = "D1Fixed"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = p
    ReplicaNode = r
    DocX = x
    DocY = y
    AckPolicy = "Proposed"
    AckScenario = "Gap"
    MinimumDurableCopies = 1
    MaxReplicaFailures = 0

SPECIFICATION D2GapFairSpec

INVARIANTS
    D2TypeOK
    D2DurableOperationProof
    D2MinimumCopies
    D1ProcessedCheckpointGapAware
    D1PersistedCheckpointGapAware
    NoCopyBehindAcked

PROPERTY D2GapProgress
