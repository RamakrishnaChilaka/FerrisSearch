CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 2
    MaxMessages = 1
    MaxViewLag = 2
    MaxAllocationId = 4
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "G2"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    LostNode = n1
    MetadataLeader = n2

INIT G2SafetyInit
NEXT G2SafetyNext

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoLostAllocationReopenedEmpty
    FailedPrimaryPromotesOrStaysRed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
