CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 0
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 2
    MaxTerm = 1
    MaxMessages = 0
    MaxViewLag = 1
    MaxAllocationId = 2
    MaxRaftEntries = 1
    MaxPendingRaft = 1
    FaultMode = "L2"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    TargetNode = n2

SPECIFICATION CrashLivenessSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm

PROPERTIES
    BarrierReleased
    RecoveryConverges
    PendingResolves
    PendingMarkerResolves
