CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 2
    MaxAllocationId = 8
    MaxRaftEntries = 5
    MaxPendingRaft = 2
    MaxRecoveries = 0
    FaultMode = "C1"
    InitialOutOfSync = FALSE
    EnableRecovery = FALSE
    AllocationIds = FALSE
    ReplicaFencing = FALSE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
