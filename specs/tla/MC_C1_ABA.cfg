CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 0
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 2
    MaxMessages = 0
    MaxViewLag = 5
    MaxAllocationId = 8
    MaxRaftEntries = 5
    MaxPendingRaft = 1
    FaultMode = "C1"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = FALSE
    ReplicaFencing = FALSE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = TRUE
    RestorePendingOnRestart = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
