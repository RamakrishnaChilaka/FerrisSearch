CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 0
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 2
    MaxMessages = 0
    MaxViewLag = 5
    MaxRaftEntries = 5
    MaxPendingRaft = 1
    FaultMode = "C1"
    InitialOutOfSync = TRUE
    EnableRecovery = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
