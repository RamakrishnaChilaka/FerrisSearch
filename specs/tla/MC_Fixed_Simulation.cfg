CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1, d2}
    MaxWrites = 4
    MaxCrashes = 2
    MaxPartitions = 1
    MaxRecoveries = 2
    MaxTerm = 4
    MaxMessages = 3
    MaxViewLag = 4
    MaxAllocationId = 12
    MaxRaftEntries = 8
    MaxPendingRaft = 2
    FaultMode = "C2"
    InitialOutOfSync = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
