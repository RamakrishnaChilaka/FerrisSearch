CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 3
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 2
    MaxAllocationId = 3
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "S1"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    FailedNode = n1
    MetadataLeader = n2
    CandidateNode = n2

SPECIFICATION ApplyStorageLivenessSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    PendingMarkerProtectsCopy
    ApplyFailureCopyRemainsOpen
    FailedApplyNeverMutatesFailedCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm

PROPERTIES
    ApplyFailureEscalates
    ApplyFailedPrimaryReplaced
    WritesResumeAfterApplyFailure
