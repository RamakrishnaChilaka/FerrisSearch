CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 0
    MaxTerm = 2
    MaxMessages = 0
    MaxViewLag = 1
    MaxAllocationId = 2
    MaxRaftEntries = 1
    MaxPendingRaft = 1
    FaultMode = "S1"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    FailedNode = n1
    MetadataLeader = n2
    CandidateNode = n2

SPECIFICATION StorageNoReplicaSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    PendingMarkerProtectsCopy
    PrimaryReportNeverMakesRed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm

PROPERTIES
    PrimaryReportEventuallyRejected
