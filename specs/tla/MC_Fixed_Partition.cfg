CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 2
    MaxCrashes = 0
    MaxPartitions = 1
    MaxRecoveries = 1
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 1
    MaxAllocationId = 6
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "C2"
    InitialOutOfSync = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
