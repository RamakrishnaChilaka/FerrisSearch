CONSTANTS
    Nodes = {n1, n2, n3}
    Docs = {d1}
    MaxWrites = 2
    MaxCrashes = 0
    MaxPartitions = 1
    MaxRecoveries = 0
    MaxTerm = 3
    MaxMessages = 2
    MaxViewLag = 2
    MaxAllocationId = 8
    MaxRaftEntries = 2
    MaxPendingRaft = 1
    FaultMode = "C2"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = FALSE
    DurableReplicaFence = FALSE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = TRUE
    RestorePendingOnRestart = TRUE
    PrimaryNode = n1
    MetadataLeader = n2

INIT C2Init
NEXT C2Next

CONSTRAINT SafetyConstraint

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    PendingMarkerProtectsCopy
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
    C2RejectsStaleMessage
