CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 1
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 2
    MaxMessages = 0
    MaxViewLag = 2
    MaxAllocationId = 2
    MaxRaftEntries = 1
    MaxPendingRaft = 1
    FaultMode = "L2"
    InitialOutOfSync = TRUE
    InitialInitialized = TRUE
    EnableRecovery = TRUE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = FALSE
    PrimaryNode = n1
    TargetNode = n2

SPECIFICATION PendingRestartSpec

INVARIANTS
    TypeOK
    RoutingWellFormed
    InitializationMonotonic
    InitializationBeforeAcknowledgement
    StaleFailShardCopyRejected
    RedShardRejectsWrites
    NoPartialServe
    AdmissionComplete
    NoAckedLoss
    PromotionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoApplyBelowObservedFence
    ActivePrimaryRejectsOldTerm
