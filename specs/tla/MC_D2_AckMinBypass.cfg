CONSTANTS
    Nodes = {p, q, r}
    Docs = {x, y}
    MaxWrites = 2
    MaxCrashes = 0
    MaxPartitions = 1
    MaxRecoveries = 0
    MaxTerm = 2
    MaxMessages = 8
    MaxViewLag = 4
    MaxAllocationId = 2
    MaxRaftEntries = 4
    MaxPendingRaft = 2
    FaultMode = "D1Fixed"
    InitialOutOfSync = FALSE
    InitialInitialized = TRUE
    EnableRecovery = FALSE
    AllocationIds = TRUE
    ReplicaFencing = TRUE
    DurableReplicaFence = TRUE
    AllowedWriteKinds = {"Put", "Delete"}
    EnableRecoveryFailures = FALSE
    RestorePendingOnRestart = TRUE
    PrimaryNode = p
    ReplicaNode = r
    DocX = x
    DocY = y
    AckPolicy = "IgnoreMinimum"
    AckScenario = "Safety"
    MinimumDurableCopies = 2
    MaxReplicaFailures = 2

INIT D2Init
NEXT D2Next

SYMMETRY D2ReplicaSymmetry

INVARIANTS
    D2TypeOK
    D2MinimumCopies
