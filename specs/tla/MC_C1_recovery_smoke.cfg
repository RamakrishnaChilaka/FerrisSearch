CONSTANTS
    Nodes = {n1, n2}
    Docs = {d1}
    MaxWrites = 1
    MaxCrashes = 0
    MaxPartitions = 0
    MaxRecoveries = 1
    MaxTerm = 3
    MaxMessages = 1
    MaxViewLag = 2
    MaxRaftEntries = 3
    MaxPendingRaft = 1
    FaultMode = "C1"
    InitialOutOfSync = TRUE
    EnableRecovery = TRUE

INIT Init
NEXT Next

CONSTRAINT SafetyConstraint
SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    RoutingWellFormed
    NoAckedLoss
    PromotionComplete
    AdmissionComplete
    UniqueAckedSeq
    NoAckedRollback
    NoAuthoritativeWipe
    NoPartialServe
